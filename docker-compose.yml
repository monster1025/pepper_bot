version: '3.3'
services:
  pepper-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: gitea.yandex5.ru/monster/pepper_bot:master
    container_name: pepper-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
    volumes:
      - ./data:/app/data
    ports:
      - "9001:8080"
    restart: unless-stopped

