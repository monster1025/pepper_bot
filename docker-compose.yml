version: '3.3'
services:
  pepper-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pepper-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

